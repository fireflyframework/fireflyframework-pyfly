version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    versioning-strategy: lockfile-only
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
    ignore:
      # Preserve the proven driver floor; uv.lock already selects newer patches.
      - dependency-name: asyncmy
        versions: [">=0.2.12"]
      # Version 2 changes fractional bucketing and existing experiment assignments.
      - dependency-name: openfeature-flagd-core
        versions: [">=2.0.0"]
      # Pydantic AI's Hugging Face extra requires hf-xet <1.5.
      - dependency-name: datasets
        versions: [">=5.1.0"]
      # The native adapter is qualified against Monty 0.0.23; qualify 1.x separately.
      - dependency-name: pydantic-monty
        versions: [">=1.0.0"]
      # Ragas 0.4 requires Instructor/Rich <15, conflicting with the native CLI.
      # Keep the qualified Ragas/LangChain community pair until it is migrated.
      - dependency-name: ragas
        versions: [">=0.2.7"]
      - dependency-name: langchain-community
        versions: [">=0.4.0"]

  - package-ecosystem: pip
    directory: "/"
    exclude-paths: ["pyproject.toml", "uv.lock"]
    schedule:
      interval: weekly
    groups:
      documentation-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

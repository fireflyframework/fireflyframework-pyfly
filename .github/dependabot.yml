version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        patterns: ["*"]
    ignore:
      # Pydantic AI's Hugging Face extra requires hf-xet <1.5.
      - dependency-name: datasets
        versions: [">=5.1.0"]
      # Monty 1.x replaces the interpreter API with a worker-pool API.
      - dependency-name: pydantic-monty
        versions: [">=1.0.0"]
      # Ragas 0.4 requires Instructor/Rich <15, conflicting with the native CLI.
      # Keep the qualified Ragas/LangChain community pair until it is migrated.
      - dependency-name: ragas
        versions: [">=0.2.7"]
      - dependency-name: langchain-community
        versions: [">=0.4.0"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  UV_PYTHON: "3.13"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  books:
    name: Build and validate books
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install book build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libharfbuzz-subset0
          python -m pip install -r book/requirements.txt pytest
      - name: Validate book sources
        run: |
          python -m pytest book/tests -q
          python book/build/verify_code.py book/manuscript
          python book/build/verify_code.py book/manuscript-es
      - name: Build both editions from this tag
        run: |
          python book/build/build.py --config book.yaml --out-dir book/release-output
          python book/build/build.py --config book.es.yaml --out-dir book/release-output
          python book/build/release_assets.py create --dir book/release-output --commit "$(git rev-parse HEAD)"
          python book/build/release_assets.py verify --dir book/release-output --commit "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@v7
        with:
          name: books
          path: book/release-output/
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, books]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history + tags so we can find the previous tag
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v8
        with:
          name: books
          path: book/release-output/
      - name: Verify books from this tag
        run: python3 book/build/release_assets.py verify --dir book/release-output --commit "$(git rev-parse HEAD)"
      - name: Build release notes from CHANGELOG
        env:
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Extract the "## <tag> (date)" section up to (but not including) the
          # next "## v" heading. CHANGELOG headings look like:
          #   ## v26.06.101 (2026-06-14)
          awk -v tag="$TAG_NAME" '
            index($0, "## " tag " ") == 1 { capture = 1; print; next }
            capture && /^## v/ { exit }
            capture { print }
          ' CHANGELOG.md > RELEASE_NOTES.md

          # Append GitHub-style "Full Changelog" compare link when a prior tag exists.
          PREV="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            {
              echo ""
              echo "**Full Changelog**: https://github.com/${REPO}/compare/${PREV}...${TAG_NAME}"
            } >> RELEASE_NOTES.md
          fi

          # Fallback to auto-generated notes if the CHANGELOG had no matching section.
          if [ -s RELEASE_NOTES.md ]; then
            echo "USE_NOTES_FILE=1" >> "$GITHUB_ENV"
          else
            echo "USE_NOTES_FILE=0" >> "$GITHUB_ENV"
          fi
      - name: Create release with assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${USE_NOTES_FILE}" = "1" ]; then
            gh release create "$TAG_NAME" dist/* book/release-output/* \
              --repo "$REPO" \
              --title "$TAG_NAME" \
              --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG_NAME" dist/* book/release-output/* \
              --repo "$REPO" \
              --title "$TAG_NAME" \
              --generate-notes
          fi

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_PYTHON: "3.13"

jobs:
  verify-ci:
    name: Verify successful CI for the release tree
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require trusted CI evidence and main ancestry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import tempfile
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          def api(endpoint):
              return json.loads(subprocess.check_output(["gh", "api", endpoint], text=True))

          tag_commit = git("rev-parse", "HEAD")
          tag_tree = git("rev-parse", "HEAD^{tree}")
          subprocess.run(["git", "merge-base", "--is-ancestor", tag_commit, "origin/main"], check=True)
          runs = api(f"repos/{repo}/actions/workflows/ci.yml/runs?status=success&per_page=100")["workflow_runs"]
          for run in runs:
              if (run["conclusion"] != "success" or run["status"] != "completed"
                  or run["path"] != ".github/workflows/ci.yml"
                  or run["repository"]["full_name"] != repo
                  or run["head_repository"]["full_name"] != repo
                  or run["event"] not in {"push", "pull_request", "workflow_dispatch", "schedule"}):
                  continue
              if run["event"] != "pull_request" and run["head_branch"] != "main":
                  continue
              attempt = str(run["run_attempt"])
              with tempfile.TemporaryDirectory() as directory:
                  result = subprocess.run([
                      "gh", "run", "download", str(run["id"]), "--repo", repo,
                      "--name", f"ci-verification-{attempt}", "--dir", directory,
                  ], capture_output=True, text=True)
                  if result.returncode:
                      continue  # Older CI runs and expired evidence cannot authorize a release.
                  try:
                      evidence = json.loads((Path(directory) / "ci-verification.json").read_text())
                  except (OSError, ValueError):
                      continue
              if not isinstance(evidence, dict):
                  continue
              if (evidence.get("repository") != repo or evidence.get("run_id") != str(run["id"])
                  or evidence.get("run_attempt") != attempt or evidence.get("tree") != tag_tree
                  or not re.fullmatch(r"[0-9a-f]{40}", str(evidence.get("commit", "")))):
                  continue
              tested = api(f"repos/{repo}/git/commits/{evidence['commit']}")
              if tested["tree"]["sha"] != tag_tree:
                  continue
              # A PR run reports its head SHA but checkout tests a synthetic merge commit.
              # Require that exact head among the tested commit's parents. Tree equality
              # permits a later squash/merge SHA; ancestry alone never permits new code.
              if run["event"] == "pull_request":
                  if run["head_sha"] not in {parent["sha"] for parent in tested["parents"]}:
                      continue
              elif evidence["commit"] != run["head_sha"]:
                  continue
              print(f"Verified {tag_commit} (tree {tag_tree}) against {run['html_url']}")
              break
          else:
              raise SystemExit("No trusted successful CI tested this exact tree; run CI on main before releasing.")
          PY

  build:
    name: Build
    needs: verify-ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/

  books:
    name: Build and validate books
    needs: verify-ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install book build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libharfbuzz-subset0
          python -m pip install -r book/requirements.txt pytest
      - name: Validate book sources
        run: |
          python -m pytest book/tests -q
          python book/build/verify_code.py book/manuscript
          python book/build/verify_code.py book/manuscript-es
      - name: Build both editions from this tag
        run: |
          python book/build/build.py --config book.yaml --out-dir book/release-output
          python book/build/build.py --config book.es.yaml --out-dir book/release-output
          python book/build/release_assets.py create --dir book/release-output --commit "$(git rev-parse HEAD)"
          python book/build/release_assets.py verify --dir book/release-output --commit "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: books
          path: book/release-output/
          if-no-files-found: error

  release:
    permissions:
      contents: write
    name: Prepare draft GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build, books]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0  # full history + tags so we can find the previous tag
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: books
          path: book/release-output/
      - name: Verify books from this tag
        run: python3 book/build/release_assets.py verify --dir book/release-output --commit "$(git rev-parse HEAD)"
      - name: Create downloadable asset checksums
        run: |
          (cd dist && sha256sum ./*) > SHA256SUMS
          (cd book/release-output && sha256sum ./*) >> SHA256SUMS
      - name: Build release notes from CHANGELOG
        env:
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Extract the "## <tag> (date)" section up to (but not including) the
          # next "## v" heading. CHANGELOG headings look like:
          #   ## v26.06.101 (2026-06-14)
          awk -v tag="$TAG_NAME" '
            index($0, "## " tag " ") == 1 { capture = 1; print; next }
            capture && /^## v/ { exit }
            capture { print }
          ' CHANGELOG.md > RELEASE_NOTES.md

          # Append GitHub-style "Full Changelog" compare link when a prior tag exists.
          PREV="$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            {
              echo ""
              echo "**Full Changelog**: https://github.com/${REPO}/compare/${PREV}...${TAG_NAME}"
            } >> RELEASE_NOTES.md
          fi

          # Fallback to auto-generated notes if the CHANGELOG had no matching section.
          if [ -s RELEASE_NOTES.md ]; then
            echo "USE_NOTES_FILE=1" >> "$GITHUB_ENV"
          else
            echo "USE_NOTES_FILE=0" >> "$GITHUB_ENV"
          fi
      - name: Update or create the draft release with assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG_NAME" --repo "$REPO" --json isDraft > "$RUNNER_TEMP/release-state.json"; then
            # devkit may create the draft concurrently after pushing the tag. If it
            # wins the race, re-read it; other creation errors still fail the job.
            if ! gh release create "$TAG_NAME" --repo "$REPO" --verify-tag --draft \
              --title "$TAG_NAME" --notes "Release assets are being verified."; then
              gh release view "$TAG_NAME" --repo "$REPO" --json isDraft > "$RUNNER_TEMP/release-state.json"
            fi
          fi
          gh release view "$TAG_NAME" --repo "$REPO" --json isDraft > "$RUNNER_TEMP/release-state.json"
          jq -e '.isDraft == true' "$RUNNER_TEMP/release-state.json" > /dev/null
          # Never overwrite assets on a published release or publish automatically.
          if [ "${USE_NOTES_FILE}" = "1" ]; then
            gh release edit "$TAG_NAME" --repo "$REPO" --draft --title "$TAG_NAME" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$TAG_NAME" dist/* book/release-output/* SHA256SUMS --repo "$REPO" --clobber

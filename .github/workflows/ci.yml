name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    - cron: "0 3 * * *"  # nightly integration run (real backends via Docker)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON: "3.13"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: uv sync --all-extras --no-extra pii --group dev
      - run: uv run ruff check src/ tests/
      - run: uv run ruff format --check src/ tests/

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: uv sync --all-extras --no-extra pii --group dev
      - run: uv run mypy src/pyfly --strict

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-extras --no-extra pii --group dev
      - name: Run tests
        run: >
          uv run pytest tests/
          --ignore=tests/data/document
          --ignore=tests/data/test_mongo_batch_operations.py
          --ignore=tests/data/test_mongo_document.py
          --ignore=tests/data/test_mongo_filter.py
          --ignore=tests/data/test_mongo_post_processor.py
          --ignore=tests/data/test_mongo_query_decorator.py
          --ignore=tests/data/test_mongo_projection_query.py
          --ignore=tests/data/test_mongo_query_compiler.py
          --ignore=tests/data/test_mongo_repository.py
          --ignore=tests/data/test_mongo_repository_parity.py
          --ignore=tests/data/test_mongo_specification.py
          --ignore=tests/data/test_mongo_wiring.py
          -q --tb=short
          --cov=src/pyfly --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml

  integration:
    name: Integration (Docker)
    # Not a PR merge gate (per project decision): runs on manual dispatch + nightly only.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: uv sync --all-extras --no-extra pii --group dev
      - name: Run integration tests (Docker required — fail, don't skip)
        env:
          PYFLY_INTEGRATION_REQUIRE_DOCKER: "1"
        run: uv run pytest -m integration tests/integration -q --tb=short

  integration-lanes:
    name: Integration lane (${{ matrix.lane }})
    # One job per database of the backend matrix (tests/support/backend_matrix.py), over the whole tests/
    # tree, so backend-matrix tests outside tests/integration run on every server too. The sqlite-file lane
    # is the `test` job. Same trigger policy as `integration`: manual dispatch + nightly, not a PR gate.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: integration-pg
            marker: pg
          - lane: integration-mysql
            marker: mysql
          - lane: integration-mariadb
            marker: mariadb
          - lane: integration-mongo-rs
            marker: mongo
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: uv sync --all-extras --no-extra pii --group dev
      - name: Run the ${{ matrix.lane }} lane (Docker required — fail, don't skip)
        env:
          PYFLY_INTEGRATION_REQUIRE_DOCKER: "1"
        run: uv run pytest -m "integration and ${{ matrix.marker }}" tests/ -q --tb=short

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, documentation]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  documentation:
    name: Documentation and book sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-docs.txt -r book/requirements.txt pytest
      - run: python -m mkdocs build --strict
      - run: python -m pytest book/tests -q
      - run: python book/build/verify_code.py book/manuscript
      - run: python book/build/verify_code.py book/manuscript-es

  webapp:
    name: Webapp browser and installed distributions
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-extras --no-extra pii --group dev --group browser
      - run: uv run playwright install --with-deps chromium
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Installed optional extras
        run: |
          export PYFLY_TEST_WHEEL="$(find dist -maxdepth 1 -name 'pyfly-*.whl' -print -quit)"
          uv run pytest tests/web/test_webapp_distribution.py -m integration -q
      - name: Browser rendering and real dashboard CRUD
        run: uv run pytest tests/browser -m browser -q
      - name: Native catalog sample
        run: PYTHONPATH=samples/webapp/src uv run pytest samples/webapp/tests -q

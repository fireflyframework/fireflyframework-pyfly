name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    - cron: "0 3 * * *"  # nightly integration run (real backends via Docker)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON: "3.13"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: uv sync --locked --all-extras --group dev --group agentic-dev
      - run: uv run ruff check src/ tests/ examples/ scripts/
      - run: uv run ruff format --check src/ tests/ examples/ scripts/
      - run: uv run python scripts/verify_agentic_migration.py

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: uv sync --locked --all-extras --group dev --group agentic-dev
      - run: uv run mypy src/pyfly --strict

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --all-extras --group dev --group agentic-dev
      - name: Run tests
        run: >
          uv run pytest tests/
          -q --tb=short
          --cov=src/pyfly --cov-report=term-missing --cov-report=xml
      - name: Native Agentic book companion
        run: PYTHONPATH=samples/agentic-book/src uv run pytest samples/agentic-book/tests -q
      - name: Upload coverage
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml

  test-sqlalchemy-2-0:
    name: Test (SQLAlchemy 2.0)
    # The lock holds the latest SQLAlchemy (2.1); PyFly keeps supporting the 2.0 line (>=2.0.50). This job
    # type-checks the package and runs the fast suite, the sqlite-file lane of the backend matrix included, on
    # the newest 2.0 release. `uv run --no-sync` keeps it: a syncing `uv run` would put the locked 2.1 back.
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-extras --group dev --group agentic-dev
      - name: Install the SQLAlchemy 2.0 line
        run: |
          uv pip install "sqlalchemy[asyncio]>=2.0.50,<2.1"
          uv run --no-sync python -c "import sqlalchemy as sa; print(sa.__version__); assert sa.__version__[:4] == '2.0.'"
      - run: uv run --no-sync mypy src/pyfly --strict
      - name: Run tests
        run: >
          uv run --no-sync pytest tests/
          -q --tb=short

  integration-sqlalchemy-2-0:
    name: Integration lane integration-pg (SQLAlchemy 2.0)
    # The pg lane on the SQLAlchemy 2.0 line (the sqlite-file lane runs in test-sqlalchemy-2-0: it has no
    # integration marker). Same trigger policy as the other Docker jobs: manual dispatch + nightly, not a PR gate.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-extras --group dev --group agentic-dev
      - name: Install the SQLAlchemy 2.0 line
        run: |
          uv pip install "sqlalchemy[asyncio]>=2.0.50,<2.1"
          uv run --no-sync python -c "import sqlalchemy as sa; print(sa.__version__); assert sa.__version__[:4] == '2.0.'"
      - name: Run the integration-pg lane (Docker required — fail, don't skip)
        env:
          PYFLY_INTEGRATION_REQUIRE_DOCKER: "1"
        run: uv run --no-sync pytest -m "integration and pg" tests/ -q --tb=short

  integration:
    name: Integration (Docker)
    # Not a PR merge gate (per project decision): runs on manual dispatch + nightly only.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: uv sync --locked --all-extras --group dev --group agentic-dev
      - name: Run integration tests (Docker required — fail, don't skip)
        env:
          PYFLY_INTEGRATION_REQUIRE_DOCKER: "1"
        run: uv run pytest -m integration tests/integration tests/agentic/integration -q --tb=short

  integration-lanes:
    name: Integration lane (${{ matrix.lane }})
    # One job per database of the backend matrix (tests/support/backend_matrix.py), over the whole tests/
    # tree, so backend-matrix tests outside tests/integration run on every server too. The sqlite-file lane
    # is the `test` job. Same trigger policy as `integration`: manual dispatch + nightly, not a PR gate.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: integration-pg
            marker: pg
          - lane: integration-mysql
            marker: mysql
          - lane: integration-mariadb
            marker: mariadb
          - lane: integration-mongo-rs
            marker: mongo
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: uv sync --locked --all-extras --group dev --group agentic-dev
      - name: Run the ${{ matrix.lane }} lane (Docker required — fail, don't skip)
        env:
          PYFLY_INTEGRATION_REQUIRE_DOCKER: "1"
        run: uv run pytest -m "integration and ${{ matrix.marker }}" tests/ -q --tb=short

  agentic-benchmarks:
    name: Agentic offline benchmarks (Python ${{ matrix.python-version }})
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --all-extras --group dev --group agentic-dev
      - name: Measure offline HTTP and TestModel streaming overhead
        run: >
          uv run pytest tests/agentic/performance -m nightly -q --benchmark-only
          --benchmark-json="${{ runner.temp }}/agentic-benchmarks.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: agentic-benchmarks-${{ matrix.python-version }}
          path: ${{ runner.temp }}/agentic-benchmarks.json

  persistent-execution-wheel:
    name: Persistent execution (installed wheel, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: uv build --wheel
      - name: Install the candidate outside the source environment
        shell: bash
        run: |
          uv venv --python 3.13 "${RUNNER_TEMP}/persistent-wheel"
          wheels=(dist/*.whl)
          uv export --locked --extra agentic-script-execution --group dev --no-emit-project --output-file "${RUNNER_TEMP}/persistent-requirements.txt"
          uv pip sync --require-hashes --python "${RUNNER_TEMP}/persistent-wheel/bin/python" "${RUNNER_TEMP}/persistent-requirements.txt"
          uv pip install --no-deps --python "${RUNNER_TEMP}/persistent-wheel/bin/python" "${wheels[0]}"
          mkdir -p "${RUNNER_TEMP}/persistent-tests"
          cp tests/agentic/unit/execution/test_persistent_session.py tests/agentic/unit/execution/test_persistent_driver.py "${RUNNER_TEMP}/persistent-tests/"
      - name: Require the real optional runtime and installed namespace
        working-directory: ${{ runner.temp }}
        run: |
          persistent-wheel/bin/python - <<'PY'
          import ast
          import hashlib
          import importlib.metadata
          import json
          import os
          import platform
          import sys
          import tomllib
          from pathlib import Path
          import pydantic_monty
          import pyfly
          from pyfly.agentic.execution import MontyEnvironment
          assert "site-packages" in pyfly.__file__, pyfly.__file__
          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          project = tomllib.loads((workspace / "pyproject.toml").read_text())
          assert importlib.metadata.version("pyfly") == project["project"]["version"]
          source = ast.parse((workspace / "src/pyfly/__init__.py").read_text())
          display_versions = [
              node.value.value for node in source.body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == "__version__" for target in node.targets)
              and isinstance(node.value, ast.Constant) and isinstance(node.value.value, str)
          ]
          assert display_versions == [pyfly.__version__]
          with MontyEnvironment().create_session() as session:
              assert session.feed("40 + 2").result.output == 42
          lock = tomllib.loads((workspace / "uv.lock").read_text())
          locked = {item["name"]: item for item in lock["package"]}
          native = {}
          for name in ("pydantic-monty", "pydantic-monty-client", "pydantic-monty-runtime"):
              dist = importlib.metadata.distribution(name)
              assert dist.version == "0.0.23"
              tags = [line.split(": ", 1)[1] for line in dist.read_text("WHEEL").splitlines() if line.startswith("Tag: ")]
              filenames = {f"{name.replace('-', '_')}-{dist.version}-{tag}.whl" for tag in tags}
              upstream = next(item for item in locked[name]["wheels"] if item["url"].split("/")[-1] in filenames)
              files = []
              for entry in dist.files:
                  if "__pycache__" in entry.parts or str(entry).endswith((".pyc", "/RECORD")):
                      continue
                  path = Path(dist.locate_file(entry)).resolve()
                  assert path.is_relative_to(Path(sys.prefix).resolve()), path
                  files.append({"path": str(path), "sha256": hashlib.sha256(path.read_bytes()).hexdigest()})
              native[name] = {"version": dist.version, "locked_wheel": upstream, "files": files}
          wheels = list((workspace / "dist").glob("*.whl"))
          assert len(wheels) == 1
          Path("persistent-native-runtime.json").write_text(json.dumps({
              "scope": "Linux installed candidate; actual native runtime, not downstream acceptance",
              "platform": platform.platform(), "python": sys.version, "namespace": pyfly.__file__,
              "pyfly_wheel_sha256": hashlib.sha256(wheels[0].read_bytes()).hexdigest(), "native": native,
          }, indent=2) + "\n")
          print(pyfly.__version__, pyfly.__file__, pydantic_monty.__version__)
          PY
      - name: Run real persistent controls, isolation and cleanup contracts
        working-directory: ${{ runner.temp }}
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: persistent-wheel/bin/python -m pytest persistent-tests -q --import-mode=importlib
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: persistent-native-runtime-linux
          path: ${{ runner.temp }}/persistent-native-runtime.json

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, documentation, persistent-execution-wheel]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  documentation:
    name: Documentation and book sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-docs.txt -r book/requirements.txt pytest
      - run: python -m mkdocs build --strict
      - run: python scripts/check_agentic_docs.py --site-dir site
      - run: python -m pytest book/tests -q
      - run: python book/build/verify_code.py book/manuscript
      - run: python book/build/verify_code.py book/manuscript-es

  agentic-distributions:
    name: Agentic distributions (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Isolated base and Agentic wheel/sdist installs
        run: >
          python scripts/check_agentic_distribution.py
          --dist-dir dist --python "$(command -v python)"
          --work-dir "$RUNNER_TEMP/agentic-distributions"
          --json "$RUNNER_TEMP/agentic-distributions.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: agentic-distributions-${{ matrix.python-version }}
          path: ${{ runner.temp }}/agentic-distributions.json

  webapp:
    name: Webapp browser and installed distributions
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-extras --group dev --group agentic-dev --group browser
      - run: uv run playwright install --with-deps chromium
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Installed optional extras
        run: |
          export PYFLY_TEST_WHEEL="$(find dist -maxdepth 1 -name 'pyfly-*.whl' -print -quit)"
          uv run pytest tests/web/test_webapp_distribution.py -m integration -q
      - name: Browser rendering and real dashboard CRUD
        run: uv run pytest tests/browser -m browser -q
      - name: Native catalog sample
        run: PYTHONPATH=samples/webapp/src uv run pytest samples/webapp/tests -q

[project]
name = "lumen-agentic-book"
version = "0.1.0"
description = "Offline native Agentic companion for PyFly by Example, Part VI"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = ["pyfly[agentic,agentic-relational]"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.uv.sources]
pyfly = { path = "../..", editable = true }

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lumen_agentic"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[project]
name = "pyfly-catalog-webapp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pyfly[webapp,data-relational]", "httpx>=0.28"]

[tool.uv.sources]
pyfly = { path = "../..", editable = true }

[dependency-groups]
dev = ["pytest>=9", "pytest-asyncio>=1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catalog"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

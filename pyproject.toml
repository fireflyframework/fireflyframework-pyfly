[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyfly"
# CalVer YY.MM.PATCH — package metadata uses PEP 440 normalized form (26.5.4);
# git tag, GitHub release and human-readable display use leading-zero form
# (v26.05.04) to match the Java/.NET/Go siblings.
version = "26.10.12"
description = "The official Python implementation of the Firefly Framework — DI, CQRS, EDA, hexagonal architecture, and more."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    { name = "Firefly Software Foundation", email = "dev@getfirefly.io" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "tzdata>=2025.2",
]

[project.urls]
Homepage = "https://github.com/fireflyframework/fireflyframework-pyfly"
Repository = "https://github.com/fireflyframework/fireflyframework-pyfly"
Organization = "https://github.com/fireflyframework"
Issues = "https://github.com/fireflyframework/fireflyframework-pyfly/issues"

[project.optional-dependencies]

# Native Agentic runtime and opt-in provider/storage integrations.
agentic = [
    "pydantic-ai[ag-ui,bedrock,cohere,groq,huggingface,mistral,retries,spec,temporal,ui,xai]==2.59.0",
    "pydantic>=2.14.1,<3",
    "pydantic-settings>=2.16.1,<3",
    "jinja2>=3.1.0",
    "httpx>=0.28.0",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "genai-prices>=0.1.13,<0.2",
    "markdown-it-py>=4.2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.2.4",
]
agentic-relational = [
    "pyfly[agentic,data-relational]",
]
agentic-postgres = [
    "pyfly[agentic,data-relational,postgresql]",
]
agentic-mongodb = [
    "pyfly[agentic,data-document]",
]
agentic-security = [
    "pyfly[agentic]",
    "cryptography>=50.0.2",
]
agentic-script-execution = [
    "pyfly[agentic]",
    "pydantic-monty==0.0.23",
]
agentic-embeddings = [
    "pyfly[agentic]",
    "numpy>=2.5.4",
]
agentic-openai-embeddings = [
    "pyfly[agentic]",
    "openai>=3.36.0",
]
agentic-cohere-embeddings = [
    "pyfly[agentic]",
    "cohere>=7.3.0",
]
agentic-google-embeddings = [
    "pyfly[agentic]",
    "google-generativeai>=0.8.6",
]
agentic-mistral-embeddings = [
    "pyfly[agentic]",
    "mistralai>=3.3.0",
]
agentic-voyage-embeddings = [
    "pyfly[agentic]",
    "voyageai>=0.5.0",
]
agentic-azure-embeddings = [
    "pyfly[agentic]",
    "openai>=3.36.0",
]
agentic-bedrock-embeddings = [
    "pyfly[agentic]",
    "boto3>=1.43.116",
]
agentic-ollama-embeddings = [
    "pyfly[agentic]",
    "httpx>=0.28.0",
]
agentic-reasoning-eval = [
    "pyfly[agentic]",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
]
agentic-vectorstores-chroma = [
    "pyfly[agentic]",
    "chromadb>=1.5.9",
]
agentic-vectorstores-sqlite-vec = [
    "pyfly[agentic]",
    "sqlite-vec>=0.1.9",
]
agentic-vectorstores-pinecone = [
    "pyfly[agentic]",
    "pinecone>=10.1.0",
]
agentic-vectorstores-qdrant = [
    "pyfly[agentic]",
    "qdrant-client>=1.19.1",
]
agentic-vectorstores-pgvector = [
    "pyfly[agentic,data-relational,postgresql]",
]
agentic-watch = [
    "pyfly[agentic]",
    "watchfiles>=1.3.0",
]
agentic-binary = [
    "pyfly[agentic]",
    "pypdf>=6.21.2",
    "Pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "cairosvg>=2.9.1",
    "py7zr>=1.1.4",
    "extract-msg>=0.56.1",
]
agentic-all = [
    "pyfly[agentic,agentic-postgres,agentic-mongodb,agentic-security,agentic-embeddings,agentic-openai-embeddings,agentic-cohere-embeddings,agentic-google-embeddings,agentic-mistral-embeddings,agentic-voyage-embeddings,agentic-azure-embeddings,agentic-bedrock-embeddings,agentic-ollama-embeddings,agentic-vectorstores-chroma,agentic-vectorstores-pinecone,agentic-vectorstores-qdrant,agentic-vectorstores-pgvector,agentic-vectorstores-sqlite-vec,agentic-watch,agentic-binary,agentic-script-execution]",
]
agentic-evaluation = [
    "pyfly[agentic]",
    "numpy>=2.5.4",
    "ragas>=0.2.6,<0.2.7",
    "datasets>=5.0.1",
    "langchain-community>=0.3.31,<0.4",
    "langchain-anthropic>=1.7.6",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.2",
]
templates = ["jinja2>=3.1.6"]
webapp = ["pyfly[web,templates,security]"]
web = [
    "starlette>=1.9.0",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.32",
]
data-relational = [
    # The 2.0.50 floor excludes broken MySQL/MariaDB async pre-ping in 2.0.49 (C089). SQLAlchemy is
    # tested on the 2.0 and 2.1 lines: the lock holds the latest release, and CI runs the suite on the newest 2.0
    # release too (test-sqlalchemy-2-0). No upper bound; what differs between the lines is bridged in
    # pyfly.data.relational.sqlalchemy.compat.
    "sqlalchemy[asyncio]>=2.0.50",
    "alembic>=1.20.0",
    "aiosqlite>=0.22.1",
]
testing = [
    "jsonpath-ng>=1.12.0",
]
argon2 = [
    "argon2-cffi>=25.1.0",  # Argon2PasswordEncoder (OWASP-preferred password hashing)
]
testcontainers = [
    "testcontainers>=4.15.0",
    "pika>=1.4.4",  # testcontainers' RabbitMqContainer imports pika for its readiness probe
]
data-document = [
    "beanie>=2.2.0",
]
postgresql = [
    "asyncpg>=0.32.0",
]
mysql = [
    # MySQL and MariaDB (mysql+asyncmy:// and mariadb+asyncmy://). asyncmy rather than aiomysql: aiomysql
    # always installs PyMySQL, and with PyMySQL >= 1.2 next to SQLAlchemy 2.0.49 every other pre-pinged
    # checkout raised TypeError (C089); asyncmy's pre-ping worked there and works on every later 2.0.x.
    # 0.2.11 is the oldest release the MySQL/MariaDB lanes were run on (with SQLAlchemy 2.0.50) and the
    # oldest with wheels for Python 3.12 and 3.13.
    "asyncmy>=0.2.11",
]
eda = [
    "aiokafka>=0.14.0",
    "aio-pika>=10.1.1",
]
fastapi = [
    "fastapi>=0.158.0",
]
granian = [
    "granian>=2.8.5",
]
hypercorn = [
    "hypercorn>=0.18.0",
]
kafka = [
    "aiokafka>=0.14.0",
]
rabbitmq = [
    "aio-pika>=10.1.1",
]
redis = [
    "redis[hiredis]>=8.1.0",
]
cache = [
    "redis[hiredis]>=8.1.0",
]
oauth2-client = ["httpx>=0.28.1"]
client = [
    "httpx>=0.28.1",
]
feature-flags = [
    # OpenFeature SDK + flagd's reference in-process evaluator (FlagdCore, spec D3); httpx serves the http source.
    "openfeature-sdk>=0.10.0",
    "openfeature-flagd-core>=1.0.0,<2",
    "httpx>=0.28",
]
config-server-git = [
    "GitPython>=3.2.1",
]
grpc = [
    "grpcio>=1.84.0",
]
websocket = [
    "websockets>=17.3",
]
idp-azure = [
    "httpx>=0.28.1",
]
idp-keycloak = [
    "httpx>=0.28.1",
]
idp-cognito = [
    "boto3>=1.43.116",
]
ecm-aws = [
    "boto3>=1.43.116",
]
ecm-azure = [
    "azure-storage-blob>=12.31.0",
]
observability = [
    "prometheus-client>=0.26.0",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "opentelemetry-instrumentation-starlette>=0.66b1",
    "structlog>=26.1.0",
]
scheduling = [
    "croniter>=6.2.4",
]
security = [
    "pyjwt[crypto]>=2.15.1",
    "bcrypt>=5.0.0",
    "cryptography>=50.0.2",
    "pyotp>=2.10.0",
]
notifications = [
    "jinja2>=3.1.6",
]
cli = [
    "click>=8.5.0",
    "rich>=15.0.0",
    "jinja2>=3.1.6",
    "questionary>=2.1.1",
]
shell = [
    "click>=8.5.0",
]
web-fast = [
    "pyfly[web,granian]",
    "uvloop>=0.23.0; sys_platform != 'win32'",
]
web-fastapi = [
    "pyfly[fastapi,granian]",
    "uvloop>=0.23.0; sys_platform != 'win32'",
]
full = [
    "pyfly[web,templates,data-relational,data-document,postgresql,mysql,eda,cache,client,grpc,websocket,ecm-aws,ecm-azure,observability,security,scheduling,cli,shell,kafka,rabbitmq,redis,granian,fastapi,hypercorn,idp-azure,idp-keycloak,idp-cognito,notifications,config-server-git,feature-flags]",
]

[dependency-groups]
agentic-dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-benchmark>=5.3.0",
    "testcontainers>=4.10.0",
    "ruff>=0.17.1",
    "pyright>=1.1.414",
    "httpx>=0.28.0",
    "pdfplumber>=0.11.10",
    "pre-commit>=4.7.0",
]
browser = ["playwright>=1.64.0"]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "coverage[toml]>=7.16.2",
    "mypy>=2.4.0",
    "ruff>=0.17.1",
    "jsonpath-ng>=1.12.0",
    "respx>=0.23.1",
    "aiosmtpd>=1.4.6",
    # The OTLP exporter is the DEFAULT tracing exporter (auto_configuration selects it as soon as an
    # endpoint is configured), yet it appears in no extra, so nothing in CI ever imported it and the
    # whole OTLP path — including how the endpoint is built — went unexercised. It is a dev dependency
    # rather than a new runtime one: applications choose their exporter and pay for it deliberately.
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    # The second MySQL/MariaDB async driver the docs name (mysql+aiomysql://). The integration lanes run
    # pool pre-ping through both drivers, so neither can regress unseen (C089).
    "aiomysql>=0.3.2",
]


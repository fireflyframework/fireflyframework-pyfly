<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 392.4"
     role="img" aria-label="Resilience chain: a request passes through Rate limiter, Bulkhead, Timeout and Circuit breaker gates left to right before reaching the Service; when a gate trips or rejects, a warn-orange failure path drops down to a Fallback that returns a default or cached response"
     font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" data-original-view-box="0 0 800 330">
  <defs>
    <linearGradient id="rs-head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10110f"/>
      <stop offset="1" stop-color="#10110f"/>
    </linearGradient>
    <linearGradient id="rs-head-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4541a"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <marker id="rs-fwd" markerWidth="9" markerHeight="9" refX="6.5" refY="3.2" orient="auto">
      <path d="M0 0L7 3.2L0 6.4Z" fill="#10110f"/>
    </marker>
    <marker id="rs-fail" markerWidth="9" markerHeight="9" refX="6.5" refY="3.2" orient="auto">
      <path d="M0 0L7 3.2L0 6.4Z" fill="#c2410c"/>
    </marker>
    <filter id="rs-sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10110f" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- card -->
  <rect x="6" y="6" width="788" height="318" rx="16" fill="#ffffff" stroke="#dedbd2" stroke-width="1.5"/>

  <!-- title rail label -->
  <text x="32" y="50" fill="#8a5714" font-size="11" font-weight="700" letter-spacing="0.08em">RESILIENCE CHAIN</text>
  <path d="M168 45 L182 45 M177 42 L182 45 L177 48" fill="none" stroke="#8a5714" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Request entry -->
  <text x="42" y="160" text-anchor="middle" fill="#62645b" font-size="11" font-weight="700">Request</text>
  <line x1="42" y1="170" x2="116" y2="170" stroke="#10110f" stroke-width="2.4" marker-end="url(#rs-fwd)"/>

  <!-- forward arrows between gates (y=170) -->
  <line x1="230" y1="170" x2="244" y2="170" stroke="#10110f" stroke-width="2.4" marker-end="url(#rs-fwd)"/>
  <line x1="356" y1="170" x2="370" y2="170" stroke="#10110f" stroke-width="2.4" marker-end="url(#rs-fwd)"/>
  <line x1="482" y1="170" x2="496" y2="170" stroke="#10110f" stroke-width="2.4" marker-end="url(#rs-fwd)"/>
  <line x1="608" y1="170" x2="634" y2="170" stroke="#10110f" stroke-width="2.4" marker-end="url(#rs-fwd)"/>

  <!-- ===== Gate nodes: w=110 h=86 y=128 ; x = 120,246,372,498 ===== -->

  <!-- Gate 1: Rate limiter -->
  <g filter="url(#rs-sh)">
    <rect x="120" y="128" width="110" height="86" rx="11" fill="#ffffff" stroke="#10110f" stroke-width="2"/>
    <path d="M120 139a11 11 0 0 1 11-11h88a11 11 0 0 1 11 11v17H120Z" fill="#10110f"/>
    <text x="175" y="145" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Rate limiter</text>
  </g>
  <text x="175" y="174" text-anchor="middle" fill="#62645b" font-size="10.5" font-family="ui-monospace,Menlo,monospace">@rate_limiter</text>
  <text x="183" y="191" text-anchor="middle" fill="#62645b" font-size="9.5">drops excess</text>
  <circle cx="133" cy="195" r="10" fill="#10110f"/><text x="133" y="198.5" text-anchor="middle" fill="#fff" font-size="10.5" font-weight="700">1</text>

  <!-- Gate 2: Bulkhead -->
  <g filter="url(#rs-sh)">
    <rect x="246" y="128" width="110" height="86" rx="11" fill="#ffffff" stroke="#10110f" stroke-width="2"/>
    <path d="M246 139a11 11 0 0 1 11-11h88a11 11 0 0 1 11 11v17H246Z" fill="#10110f"/>
    <text x="301" y="145" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Bulkhead</text>
  </g>
  <text x="301" y="174" text-anchor="middle" fill="#62645b" font-size="10.5" font-family="ui-monospace,Menlo,monospace">@bulkhead</text>
  <text x="309" y="191" text-anchor="middle" fill="#62645b" font-size="9.5">caps concurrency</text>
  <circle cx="259" cy="195" r="10" fill="#10110f"/><text x="259" y="198.5" text-anchor="middle" fill="#fff" font-size="10.5" font-weight="700">2</text>

  <!-- Gate 3: Timeout -->
  <g filter="url(#rs-sh)">
    <rect x="372" y="128" width="110" height="86" rx="11" fill="#ffffff" stroke="#10110f" stroke-width="2"/>
    <path d="M372 139a11 11 0 0 1 11-11h88a11 11 0 0 1 11 11v17H372Z" fill="#10110f"/>
    <text x="427" y="145" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Timeout</text>
  </g>
  <text x="427" y="174" text-anchor="middle" fill="#62645b" font-size="10.5" font-family="ui-monospace,Menlo,monospace">@time_limiter</text>
  <text x="435" y="191" text-anchor="middle" fill="#62645b" font-size="9.5">cancels slow calls</text>
  <circle cx="385" cy="195" r="10" fill="#10110f"/><text x="385" y="198.5" text-anchor="middle" fill="#fff" font-size="10.5" font-weight="700">3</text>

  <!-- Gate 4: Circuit breaker -->
  <g filter="url(#rs-sh)">
    <rect x="498" y="128" width="110" height="86" rx="11" fill="#ffffff" stroke="#10110f" stroke-width="2"/>
    <path d="M498 139a11 11 0 0 1 11-11h88a11 11 0 0 1 11 11v17H498Z" fill="#10110f"/>
    <text x="553" y="145" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Circuit breaker</text>
  </g>
  <text x="557" y="173" text-anchor="middle" fill="#62645b" font-size="10">closed -&gt; open</text>
  <text x="557" y="187" text-anchor="middle" fill="#62645b" font-size="10">-&gt; half-open</text>
  <text x="565" y="203" text-anchor="middle" fill="#62645b" font-size="9">trips on failure</text>
  <circle cx="511" cy="195" r="10" fill="#10110f"/><text x="511" y="198.5" text-anchor="middle" fill="#fff" font-size="10.5" font-weight="700">4</text>

  <!-- ===== Service node (right) ===== -->
  <g filter="url(#rs-sh)">
    <rect x="636" y="128" width="120" height="86" rx="11" fill="#ffffff" stroke="#10110f" stroke-width="2"/>
    <path d="M636 139a11 11 0 0 1 11-11h98a11 11 0 0 1 11 11v17H636Z" fill="#10110f"/>
    <text x="696" y="145" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Service</text>
  </g>
  <text x="696" y="182" text-anchor="middle" fill="#62645b" font-size="10.5">downstream call</text>
  <text x="696" y="198" text-anchor="middle" fill="#62645b" font-size="9.5">AccountService</text>

  <!-- ===== Failure path: gate trips / rejects -> Fallback (warn orange, dashed) ===== -->
  <!-- drop from circuit breaker, run right, into the Fallback left edge -->
  <path d="M553 214 L553 270 L626 270" fill="none" stroke="#c2410c" stroke-width="2.4"
        stroke-dasharray="5,4" marker-end="url(#rs-fail)"/>

  <!-- failure label chip on the failure rail -->
  <rect x="248" y="259" width="170" height="22" rx="11" fill="#fff5f0" stroke="#c2410c" stroke-width="1.5"/>
  <text x="333" y="274" text-anchor="middle" fill="#c2410c" font-size="10" font-weight="600">open / rejected / timed out</text>

  <!-- ===== Fallback node ===== -->
  <g filter="url(#rs-sh)">
    <rect x="630" y="242" width="148" height="56" rx="11" fill="#fff5f0" stroke="#c2410c" stroke-width="2"/>
    <path d="M630 253a11 11 0 0 1 11-11h126a11 11 0 0 1 11 11v13H630Z" fill="url(#rs-head-warn)"/>
    <text x="704" y="259" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Fallback</text>
  </g>
  <text x="704" y="284" text-anchor="middle" fill="#62645b" font-size="10.5">default / cached response</text>

<g data-framework-brand="2026-10-08" aria-hidden="true"><rect x="0" y="330" width="800" height="62.4" fill="#ffffff"/><path d="M12 332H788" stroke="#dedbd2" stroke-width="1"/><path d="M12 332H80" stroke="#ffb34a" stroke-width="2"/><!-- framework-logo:start --><svg xmlns="http://www.w3.org/2000/svg" width="84.05" height="54.4" viewBox="0 0 373.88 242" x="703.95" y="334.0" aria-hidden="true"><g fill="#10110f" transform="translate(20 130) scale(0.07 -0.07)"><g transform="translate(0 0)"><path d="M636 -30Q484 -30 380 46Q346 70 318 100L318 -480L139 -480L139 1080L298 1080L298 960Q334 1003 381 1036Q485 1110 637 1110Q787 1110 895.5 1035.5Q1004 961 1062 832Q1120 703 1120 541Q1120 379 1062 250Q1004 121 895.5 45.5Q787 -30 636 -30ZM614 133Q721 133 791 187Q861 241 896 333.5Q931 426 931 541Q931 655 896.5 747Q862 839 790.5 893Q719 947 609 947Q504 947 435 895.5Q366 844 332 752.5Q298 661 298 541Q298 423 331.5 330.5Q365 238 435 185.5Q505 133 614 133Z" /></g><g transform="translate(1160 0)"><path d="M290 -480L468 4L30 1080L217 1080L554 230L870 1080L1051 1080L463 -480Z" /></g><g transform="translate(2316 0)"><path d="M243 0L243 933L60 933L60 1080L243 1080L243 1139Q243 1181 247 1224.5Q251 1268 265 1309.5Q279 1351 311 1386Q348 1427 392 1444.5Q436 1462 481.5 1466Q527 1470 568 1470L705 1470L705 1322L578 1322Q499 1322 460 1283.5Q421 1245 421 1167L421 1080L954 1080L954 1470L1132 1470L1132 0L954 0L954 933L421 933L421 0Z" /></g><g transform="translate(3608 0)"><g data-family-terminal="trail-y"><defs><linearGradient id="brand-bc733f7236-logo-family-pyfly-20-130-140" gradientUnits="userSpaceOnUse" x1="30" y1="1080" x2="554" y2="230"><stop offset="0" stop-color="#ffb34a" stop-opacity="0.2" /><stop offset="0.8" stop-color="#ffb34a" stop-opacity="1" /></linearGradient></defs><path d="M290 -480L468 4L30 1080L217 1080L554 230L870 1080L1051 1080L463 -480Z" fill="url(#brand-bc733f7236-logo-family-pyfly-20-130-140)" /></g></g></g><g fill="#62645b" transform="translate(25 210) scale(0.0155 -0.0155)"><pat